services:
  autodarts:
    image: michvllni/autodarts:latest
    container_name: autodarts
    restart: unless-stopped
    # host networking lets the Autodarts Desktop app and `autodarts remote` discover the board
    # via mDNS and avoids long loading times on the boards/lobby pages.
    # If you cannot use it, remove this line and uncomment the ports section instead.
    network_mode: host
    # ports:
    # - 3180:3180
    devices:
    - /dev/video0:/dev/video0
    - /dev/video2:/dev/video2
    - /dev/video4:/dev/video4
    volumes:
    - ./config:/root/.config/autodarts
