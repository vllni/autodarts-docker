# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish autodarts docker image

#trigger when a new version tag is set
on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force a rebuild and push even when no new autodarts version is available
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  AUTODARTS_IMAGE_NAME: michvllni/autodarts

jobs:
  get_target_version:
    name: Get latest release from autodarts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.autodarts-latest-release.outputs.version }}
      create_release: ${{ steps.autodarts-latest-release.outputs.create_release }}
    steps:
      - name: Get latest release from autodarts
        id: autodarts-latest-release
        run: |
          #only build once every platform we publish is on the same version
          latestVersion=$(curl -s https://releases.autodarts.com/headless/downloads/latest.stable.json | jq -r '[.platforms["linux-amd64"].version, .platforms["linux-arm64"].version] | unique | if length == 1 then .[0] else empty end')
          if [ -z "$latestVersion" ]; then
            echo "Could not determine a common latest version for all platforms"
            exit 1
          fi
          echo "Latest version from autodarts: $latestVersion"

          #get current version from docker hub michvllni/autodarts-docker
          currentVersion=$(curl -s "https://hub.docker.com/v2/repositories/michvllni/autodarts/tags/?page_size=100" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Current version from docker hub: $currentVersion"
          if [ "$latestVersion" != "$currentVersion" ]; then
            echo "New version available"
            echo "version=$latestVersion" >> $GITHUB_OUTPUT
            echo "create_release=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "Manual force rebuild requested"
            echo "version=$latestVersion" >> $GITHUB_OUTPUT
            echo "create_release=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Dockerfile changed, rebuilding latest image"
            echo "version=$latestVersion" >> $GITHUB_OUTPUT
            echo "create_release=false" >> $GITHUB_OUTPUT
          else
            echo "No new version available"
            echo "create_release=false" >> $GITHUB_OUTPUT
          fi
        shell: bash
  push_to_registry:
    name: Build and Push Docker image to Github Container Registry
    runs-on: ubuntu-latest
    needs: get_target_version
    if: needs.get_target_version.outputs.version != null && needs.get_target_version.outputs.version != ''
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker Image Metadata
        id: set_image_metadata
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            docker.io/${{ env.AUTODARTS_IMAGE_NAME }}
          # Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ needs.get_target_version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.get_target_version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.get_target_version.outputs.version }}
            type=sha
            latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.get_target_version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.set_image_metadata.outputs.tags }}
          labels: ${{ steps.set_image_metadata.outputs.labels }}

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - get_target_version
      - push_to_registry
    if: needs.get_target_version.outputs.version != '' && needs.get_target_version.outputs.create_release == 'true' && github.event_name != 'pull_request'
    steps:
      # releases follow the autodarts version, so several releases can point at the same commit.
      # GitHub then skips those when guessing the previous tag, so it is passed explicitly.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.get_target_version.outputs.version }}
        run: |
          previousTag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          echo "Previous release: ${previousTag:-none}"

          args=(-f tag_name="$TAG" -f target_commitish="${{ github.sha }}")
          if [ -n "$previousTag" ]; then
            args+=(-f previous_tag_name="$previousTag")
          fi

          {
            if [ -n "$previousTag" ]; then
              echo "Updates Autodarts from ${previousTag} to ${TAG}."
            else
              echo "Autodarts ${TAG}."
            fi
            echo
            gh api "repos/${{ github.repository }}/releases/generate-notes" "${args[@]}" --jq '.body'
          } > release-notes.md
          cat release-notes.md
        shell: bash

      - name: Create GitHub tag and release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.get_target_version.outputs.version }}
          name: v${{ needs.get_target_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
